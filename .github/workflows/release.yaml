name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit tests
        run: go test -v ./...

      - name: Build static binaries
        run: |
          mkdir -p dist
          # Linux amd64 (x86_64)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/homelab-version-agent-linux-amd64 ./cmd/agent
          # Linux arm64 (aarch64) - przydatne dla Raspberry Pi / ARM LXC
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/homelab-version-agent-linux-arm64 ./cmd/agent

          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/homelab-version-agent-linux-amd64
            dist/homelab-version-agent-linux-arm64
            dist/checksums.txt
          generate_release_notes: true
